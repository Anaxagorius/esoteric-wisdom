<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login — Esoteric Wisdom</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="Admin Login — Esoteric Wisdom" />
    <meta property="og:description" content="Admin login for the Esoteric Wisdom spiritual portal." />
    <meta property="og:type" content="website" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
      body {
        background: radial-gradient(ellipse at top, #78350f 0%, #1e1b4b 30%, #020617 70%, #000000 100%);
        font-family: 'Raleway', sans-serif;
      }
      .font-cinzel { font-family: 'Cinzel Decorative', serif; }
      @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
      .star { position: absolute; border-radius: 50%; background: white; animation: twinkle var(--dur, 3s) ease-in-out infinite; animation-delay: var(--delay, 0s); }
      @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
      .floating { animation: float 4s ease-in-out infinite; }
    </style>
  </head>
  <body class="min-h-screen text-white flex items-center justify-center px-4">
    <div id="starfield" class="fixed inset-0 pointer-events-none z-0"></div>

    <div class="relative z-10 w-full max-w-md">
      <div class="text-center mb-8">
        <div class="floating inline-block text-5xl mb-3">🔑</div>
        <h1 class="font-cinzel text-2xl text-amber-300">Admin Portal</h1>
        <p class="text-amber-200/60 text-sm mt-1">Restricted access — administrators only</p>
      </div>

      <div class="bg-black/60 border border-amber-600/50 rounded-3xl p-8 shadow-2xl backdrop-blur-xl"
           style="box-shadow: 0 0 60px rgba(245,158,11,0.15);">
        <h2 class="text-xl font-semibold mb-6 text-center text-amber-200">Admin Sign In</h2>

        {% if error.is_some() %}
        <div class="mb-4 text-sm text-red-300 bg-red-900/30 border border-red-500/50 rounded-xl p-3 flex items-center gap-2">
          <span>⚠️</span> {{ error.as_ref().unwrap() }}
        </div>
        {% endif %}

        <form method="post" action="/admin/login" class="space-y-4">
          <div>
            <label class="block text-sm mb-1.5 text-amber-200">Username</label>
            <input type="text" name="username" required autocomplete="username"
              class="w-full rounded-xl bg-black/70 border border-amber-500/40 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-400/60 focus:border-amber-400/60 transition-all text-sm"
              placeholder="Admin username" />
          </div>
          <div>
            <label class="block text-sm mb-1.5 text-amber-200">Password</label>
            <input type="password" name="password" required autocomplete="current-password"
              class="w-full rounded-xl bg-black/70 border border-amber-500/40 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-400/60 focus:border-amber-400/60 transition-all text-sm"
              placeholder="••••••••" />
          </div>
          <button type="submit"
            class="w-full mt-2 py-3 rounded-full bg-gradient-to-r from-amber-500 to-orange-600 font-semibold hover:scale-105 hover:shadow-lg hover:shadow-amber-500/30 transition-all duration-300">
            🔑 Enter Admin Portal
          </button>
        </form>
      </div>

      <div class="text-center mt-6">
        <a href="/" class="text-xs text-amber-300/50 hover:text-amber-300 transition-colors">← Back to Portal Entrance</a>
      </div>
    </div>

    <script>
      const sf = document.getElementById('starfield');
      for (let i = 0; i < 120; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2 + 0.5;
        s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--dur:${2+Math.random()*4}s;--delay:${Math.random()*5}s;`;
        sf.appendChild(s);
      }
    </script>
  </body>
</html>
