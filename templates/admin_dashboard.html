<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Admin Dashboard — Anomalous Inquiry</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
      body {
        background: radial-gradient(circle at top, #0c2430 0%, #020617 50%, #000000 100%);
        font-family: 'Raleway', sans-serif;
      }
      @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
      .star { position: absolute; border-radius: 50%; background: white; animation: twinkle var(--dur,3s) ease-in-out infinite; animation-delay: var(--delay,0s); }
      .font-cinzel { font-family: 'Cinzel Decorative', serif; }
    </style>
  </head>
  <body class="min-h-screen text-white px-4 py-8">
    <div id="starfield" class="fixed inset-0 pointer-events-none z-0"></div>
    <div class="relative z-10 max-w-4xl mx-auto space-y-8">
      <header class="flex items-center justify-between">
        <h1 class="text-3xl font-bold">🔒 Admin Dashboard</h1>
        <nav class="flex gap-4 text-sm">
          <a href="/journal" class="text-teal-300 hover:underline">Journal</a>
          <a href="/home" class="text-teal-300 hover:underline">Archive</a>
          <a href="/admin/logout" class="text-teal-300 hover:underline">Logout</a>
        </nav>
      </header>
      <section class="bg-white/5 border border-cyan-500/40 rounded-2xl p-6 backdrop-blur-md">
        <h2 class="text-xl font-semibold mb-2">Quick Actions</h2>
        <div class="flex gap-4 flex-wrap">
          <a href="/journal" class="px-4 py-2 rounded-lg bg-gradient-to-r from-teal-500 to-cyan-600 text-sm font-semibold hover:opacity-90 transition">Manage Journal</a>
          <a href="/admin/change-password" class="px-4 py-2 rounded-lg border border-teal-500/40 text-sm font-semibold hover:bg-teal-500/20 transition">Change Password</a>
        </div>
      </section>
    </div>
    <script>
      const sf = document.getElementById('starfield');
      for (let i = 0; i < 160; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2 + 0.5;
        s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--dur:${2+Math.random()*4}s;--delay:${Math.random()*5}s;opacity:${0.2+Math.random()*0.8};`;
        sf.appendChild(s);
      }
    </script>
  </body>
</html>
